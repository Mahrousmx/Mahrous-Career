<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohamed Mahrous | Supply Chain Manager</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#16181d;--mute:#5d6470;--acc:#0b5fff;--acc2:#ff9900;--line:#e3e1da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1014;--card:#171a20;--ink:#f1f2f4;--mute:#9aa1ad;--acc:#6b9bff;--line:#2a2e36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1014;--card:#171a20;--ink:#f1f2f4;--mute:#9aa1ad;--acc:#6b9bff;--line:#2a2e36;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;pointer-events:none;animation:float 14s ease-in-out infinite}
.b1{width:340px;height:340px;background:var(--acc);top:-80px;left:-80px}
.b2{width:300px;height:300px;background:var(--acc2);bottom:-60px;right:-60px;animation-delay:-7s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.15)}}
main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:40px 20px 56px}
.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;font-size:34px;font-weight:700;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}}
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:20px;padding:28px 20px 20px;border:1px solid var(--line)}
.hero-bg{position:absolute;inset:-30px;z-index:-2;background:linear-gradient(135deg,var(--acc),var(--acc2)) center 22%/cover;transform:scale(1.05)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom,transparent 30%,var(--bg))}
h1{font-size:2.1rem;margin:18px 0 4px;letter-spacing:-.02em}
.role{color:var(--mute);margin:0 0 16px;font-size:1.05rem;min-height:1.6em}
.role b{color:var(--acc);font-weight:600}
.cur{display:inline-block;width:2px;height:1em;background:var(--acc);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 8px}
.btn{padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:600;border:1px solid var(--line);color:var(--ink);background:var(--card);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px;transition:transform .15s ease-out,box-shadow .3s}
.card:hover{box-shadow:0 10px 30px rgba(0,0,0,.12)}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem;transition:.2s}
.tags span:hover{background:var(--acc);color:#fff;border-color:var(--acc);transform:scale(1.06)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
.amz{width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0}
.amz strong{font-size:1.15rem}
.amz small{display:block;color:var(--mute)}
.chev{font-size:1.4rem;color:var(--acc2);transition:transform .3s}
.amz[aria-expanded="true"] .chev{transform:rotate(180deg)}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s ease}
.panel.open{grid-template-rows:1fr}
.panel>div{overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-top:18px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}
.num{font-size:2rem;font-weight:800;color:var(--acc2);line-height:1.1}
.lbl{color:var(--mute);font-size:.88rem}
.warn{background:#fff3cd;color:#664d03;border-radius:8px;padding:6px 10px;font-size:.8rem;margin-top:12px;display:none}
.sample .warn{display:block}
.lb div{width:min(90vw,520px);aspect-ratio:4/3;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;text-align:center;padding:20px}
.role-item{border-top:1px solid var(--line)}
.role-item:first-of-type{border-top:0}
.rb{width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.rb strong{display:block}
.rb small{color:var(--mute)}
.rb[aria-expanded="true"] .chev{transform:rotate(180deg)}
.role-item ul{margin:0;padding:0 0 14px 20px}
.role-item li{margin:6px 0;font-size:.95rem}
.edu p{margin:0 0 6px}
.lng{position:absolute;top:86px;right:14px;z-index:2;width:64px;display:flex;border-radius:999px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.lng button{flex:1;border:0;background:none;color:var(--ink);font:600 .75rem/1 system-ui,sans-serif;padding:8px 0;cursor:pointer}
.lng button[aria-pressed="true"]{background:var(--acc);color:#fff}
.hero{padding-top:34px}
.hero h1{margin-top:4px;padding-right:78px}
.hero .role{padding-right:78px}
.tap{text-align:center;margin:16px 0 0;color:var(--mute);font-weight:500}
.role-item .stats{padding:2px 0 14px}
.role-item .num{color:var(--acc);font-size:1.6rem}
.role-item .stat{padding:12px}
.role-item .lbl{font-size:.82rem}
footer{color:var(--mute);font-size:.85rem;margin-top:28px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

#amzCard{background:rgba(18,20,26,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-color:rgba(255,255,255,.18);color:#f1f2f4}
#amzCard .amz strong{color:#ff9900;font-size:1.25rem;letter-spacing:.01em;text-shadow:0 0 18px rgba(255,153,0,.35)}
#amzCard small,#amzCard .lbl{color:#b9bfca}
#amzCard .stat{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15)}
.qrb{position:absolute;top:14px;right:14px;width:64px;height:64px;border-radius:12px;background:#fff;border:0;padding:4px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.28);transition:transform .2s;z-index:2}
.qrb:hover{transform:scale(1.07)}
.qrb svg,.qrbox svg{width:100%;height:100%;display:block}
.qrm{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:30;padding:20px}
.qrm.on{display:grid}
.qrbox{background:#fff;color:#16181d;border-radius:18px;padding:18px;width:min(86vw,320px);text-align:center}
.qrbox .q{aspect-ratio:1;width:100%}
.qrbox p{margin:10px 0 0;font-weight:600}
.qrbox small{color:#5d6470}
</style>
</head>

<script>var qrcode = function() {
var qrcode = function(typeNumber, errorCorrectionLevel) {
var PAD0 = 0xEC;
var PAD1 = 0x11;
var _typeNumber = typeNumber;
var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
var _modules = null;
var _moduleCount = 0;
var _dataCache = null;
var _dataList = [];
var _this = {};
var makeImpl = function(test, maskPattern) {
_moduleCount = _typeNumber * 4 + 17;
_modules = function(moduleCount) {
var modules = new Array(moduleCount);
for (var row = 0; row < moduleCount; row += 1) {
modules[row] = new Array(moduleCount);
for (var col = 0; col < moduleCount; col += 1) {
modules[row][col] = null;
}
}
return modules;
}(_moduleCount);
setupPositionProbePattern(0, 0);
setupPositionProbePattern(_moduleCount - 7, 0);
setupPositionProbePattern(0, _moduleCount - 7);
setupPositionAdjustPattern();
setupTimingPattern();
setupTypeInfo(test, maskPattern);
if (_typeNumber >= 7) {
setupTypeNumber(test);
}
if (_dataCache == null) {
_dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
}
mapData(_dataCache, maskPattern);
};
var setupPositionProbePattern = function(row, col) {
for (var r = -1; r <= 7; r += 1) {
if (row + r <= -1 || _moduleCount <= row + r) continue;
for (var c = -1; c <= 7; c += 1) {
if (col + c <= -1 || _moduleCount <= col + c) continue;
if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
|| (0 <= c && c <= 6 && (r == 0 || r == 6) )
|| (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
_modules[row + r][col + c] = true;
} else {
_modules[row + r][col + c] = false;
}
}
}
};
var getBestMaskPattern = function() {
var minLostPoint = 0;
var pattern = 0;
for (var i = 0; i < 8; i += 1) {
makeImpl(true, i);
var lostPoint = QRUtil.getLostPoint(_this);
if (i == 0 || minLostPoint > lostPoint) {
minLostPoint = lostPoint;
pattern = i;
}
}
return pattern;
};
var setupTimingPattern = function() {
for (var r = 8; r < _moduleCount - 8; r += 1) {
if (_modules[r][6] != null) {
continue;
}
_modules[r][6] = (r % 2 == 0);
}
for (var c = 8; c < _moduleCount - 8; c += 1) {
if (_modules[6][c] != null) {
continue;
}
_modules[6][c] = (c % 2 == 0);
}
};
var setupPositionAdjustPattern = function() {
var pos = QRUtil.getPatternPosition(_typeNumber);
for (var i = 0; i < pos.length; i += 1) {
for (var j = 0; j < pos.length; j += 1) {
var row = pos[i];
var col = pos[j];
if (_modules[row][col] != null) {
continue;
}
for (var r = -2; r <= 2; r += 1) {
for (var c = -2; c <= 2; c += 1) {
if (r == -2 || r == 2 || c == -2 || c == 2
|| (r == 0 && c == 0) ) {
_modules[row + r][col + c] = true;
} else {
_modules[row + r][col + c] = false;
}
}
}
}
}
};
var setupTypeNumber = function(test) {
var bits = QRUtil.getBCHTypeNumber(_typeNumber);
for (var i = 0; i < 18; i += 1) {
var mod = (!test && ( (bits >> i) & 1) == 1);
_modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
}
for (var i = 0; i < 18; i += 1) {
var mod = (!test && ( (bits >> i) & 1) == 1);
_modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
}
};
var setupTypeInfo = function(test, maskPattern) {
var data = (_errorCorrectionLevel << 3) | maskPattern;
var bits = QRUtil.getBCHTypeInfo(data);
for (var i = 0; i < 15; i += 1) {
var mod = (!test && ( (bits >> i) & 1) == 1);
if (i < 6) {
_modules[i][8] = mod;
} else if (i < 8) {
_modules[i + 1][8] = mod;
} else {
_modules[_moduleCount - 15 + i][8] = mod;
}
}
for (var i = 0; i < 15; i += 1) {
var mod = (!test && ( (bits >> i) & 1) == 1);
if (i < 8) {
_modules[8][_moduleCount - i - 1] = mod;
} else if (i < 9) {
_modules[8][15 - i - 1 + 1] = mod;
} else {
_modules[8][15 - i - 1] = mod;
}
}
_modules[_moduleCount - 8][8] = (!test);
};
var mapData = function(data, maskPattern) {
var inc = -1;
var row = _moduleCount - 1;
var bitIndex = 7;
var byteIndex = 0;
var maskFunc = QRUtil.getMaskFunction(maskPattern);
for (var col = _moduleCount - 1; col > 0; col -= 2) {
if (col == 6) col -= 1;
while (true) {
for (var c = 0; c < 2; c += 1) {
if (_modules[row][col - c] == null) {
var dark = false;
if (byteIndex < data.length) {
dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
}
var mask = maskFunc(row, col - c);
if (mask) {
dark = !dark;
}
_modules[row][col - c] = dark;
bitIndex -= 1;
if (bitIndex == -1) {
byteIndex += 1;
bitIndex = 7;
}
}

if (row < 0 || _moduleCount <= row) {
row -= inc;
inc = -inc;

};
var createBytes = function(buffer, rsBlocks) {

var maxDcCount = 0;

var ecdata = new Array(rsBlocks.length);
for (var r = 0; r < rsBlocks.length; r += 1) {
var dcCount = rsBlocks[r].dataCount;
var ecCount = rsBlocks[r].totalCount - dcCount;
maxDcCount = Math.max(maxDcCount, dcCount);
maxEcCount = Math.max(maxEcCount, ecCount);
dcdata[r] = new Array(dcCount);
for (var i = 0; i < dcdata[r].length; i += 1) {
dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
}
offset += dcCount;

var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);
var modPoly = rawPoly.mod(rsPoly);
ecdata[r] = new Array(rsPoly.getLength() - 1);
for (var i = 0; i < ecdata[r].length; i += 1) {
var modIndex = i + modPoly.getLength() - ecdata[r].length;
ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
}
}
var totalCodeCount = 0;
for (var i = 0; i < rsBlocks.length; i += 1) {
totalCodeCount += rsBlocks[i].totalCount;
}
var data = new Array(totalCodeCount);
var index = 0;
for (var i = 0; i < maxDcCount; i += 1) {
for (var r = 0; r < rsBlocks.length; r += 1) {
if (i < dcdata[r].length) {
data[index] = dcdata[r][i];
index += 1;
}
}
}
for (var i = 0; i < maxEcCount; i += 1) {
for (var r = 0; r < rsBlocks.length; r += 1) {

data[index] = ecdata[r][i];
index += 1;
}
}

};
var createData = function(typeNumber, errorCorrectionLevel, dataList) {
var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);
var buffer = qrBitBuffer();
for (var i = 0; i < dataList.length; i += 1) {
var data = dataList[i];
buffer.put(data.getMode(), 4);
buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
data.write(buffer);
}
var totalDataCount = 0;
for (var i = 0; i < rsBlocks.length; i += 1) {
totalDataCount += rsBlocks[i].dataCount;
}
if (buffer.getLengthInBits() > totalDataCount * 8) {
throw 'code length overflow. ('
+ buffer.getLengthInBits()
+ '>'
+ totalDataCount * 8
+ ')';
}
if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
buffer.put(0, 4);
}
while (buffer.getLengthInBits() % 8 != 0) {
buffer.putBit(false);
}
while (true) {
if (buffer.getLengthInBits() >= totalDataCount * 8) {
break;
}
buffer.put(PAD0, 8);
if (buffer.getLengthInBits() >= totalDataCount * 8) {
break;
}
buffer.put(PAD1, 8);
}
return createBytes(buffer, rsBlocks);
};
_this.addData = function(data, mode) {
mode = mode || 'Byte';
var newData = null;
switch(mode) {
case 'Numeric' :
newData = qrNumber(data);
break;
case 'Alphanumeric' :
newData = qrAlphaNum(data);
break;
case 'Byte' :
newData = qr8BitByte(data);
break;
case 'Kanji' :
newData = qrKanji(data);
break;
default :
throw 'mode:' + mode;
}
_dataList.push(newData);
_dataCache = null;
};
_this.isDark = function(row, col) {
if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
throw row + ',' + col;
}
return _modules[row][col];
};
_this.getModuleCount = function() {
return _moduleCount;
};
_this.make = function() {
if (_typeNumber < 1) {
var typeNumber = 1;
for (; typeNumber < 40; typeNumber++) {
var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
var buffer = qrBitBuffer();
for (var i = 0; i < _dataList.length; i++) {
var data = _dataList[i];
buffer.put(data.getMode(), 4);
buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
data.write(buffer);
}
var totalDataCount = 0;
for (var i = 0; i < rsBlocks.length; i++) {
totalDataCount += rsBlocks[i].dataCount;
}
if (buffer.getLengthInBits() <= totalDataCount * 8) {
break;
}
}
_typeNumber = typeNumber;

qrHtml += '">';

qrHtml += ' border-collapse: collapse;';
qrHtml += ' padding: 0px; margin: 0px;';

qrHtml += ' height: ' + cellSize + 'px;';

qrHtml += '</table>';

/* ====================== */
(function(){
  var h = document.getElementById("heroBg");
  if (HERO.src) h.style.backgroundImage = 'url("' + HERO.src + '")';
  h.style.filter = "blur(" + HERO.blur + "px)";
  h.style.opacity = HERO.src ? HERO.opacity : .35;
})();

var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
var LANG = "en", LI = 0, amzOpen = false, openRole = {};
var statsEl = document.getElementById("stats"), exp = document.getElementById("exp");
var btn = document.getElementById("amzBtn"), panel = document.getElementById("amzPanel");

function fmt(n, e){
  var t = n._t, dec = t.d || 0, s = Array.isArray(t.s) ? t.s[LI] : (t.s || "");
  n.textContent = (t.p || "") + (t.v * e).toLocaleString(LANG, {minimumFractionDigits:dec, maximumFractionDigits:dec}) + s;
}
function run(root, instant){
  root.querySelectorAll(".num").forEach(function(n){
    var t0 = null;
    if (reduce || instant) { fmt(n, 1); return; }
    function step(t){
      if (!t0) t0 = t;
      var p = Math.min((t - t0) / 1400, 1);
      fmt(n, 1 - Math.pow(1 - p, 3));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function tiles(list, host){
  list.forEach(function(t){
    var d = document.createElement("div"), n = document.createElement("div"), l = document.createElement("div");
    d.className = "stat"; n.className = "num"; l.className = "lbl";
    n._t = t; n.textContent = "0"; l.textContent = t.l[LI];
    d.appendChild(n); d.appendChild(l); host.appendChild(d);
  });
}
function build(){
  statsEl.innerHTML = "";
  tiles(STATS, statsEl);
  if (amzOpen) run(statsEl, true);
  exp.innerHTML = "";
  ROLES.forEach(function(r, idx){
    var w = document.createElement("div"), b = document.createElement("button"), pn = document.createElement("div"), inner = document.createElement("div"), g = document.createElement("div");
    w.className = "role-item"; b.className = "rb"; pn.className = "panel" + (openRole[idx] ? " open" : ""); g.className = "stats";
    b.setAttribute("aria-expanded", openRole[idx] ? "true" : "false");
    b.innerHTML = "<span><strong></strong><small></small></span><span class='chev'>⌄</span>";
    b.querySelector("strong").textContent = r.t[LI];
    b.querySelector("small").textContent = "Amazon · " + r.m[LI];
    tiles(r.n, g); inner.appendChild(g); pn.appendChild(inner);
    if (openRole[idx]) run(pn, true);
    b.addEventListener("click", function(){
      var o = pn.classList.toggle("open");
      openRole[idx] = o; b.setAttribute("aria-expanded", o);
      if (o) run(pn, false);
    });
    w.appendChild(b); w.appendChild(pn); exp.appendChild(w);
  });
}
function setLang(l){
  LANG = l; LI = l === "de" ? 1 : 0;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(function(el){ el.innerHTML = TX[l][el.dataset.i]; });
  document.querySelectorAll("#lng button").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.l === l ? "true" : "false"); });
  if (reduce) document.querySelector("#role b").textContent = TITLES[LI][0];
  build();
}
document.querySelectorAll("#lng button").forEach(function(b){ b.addEventListener("click", function(){ setLang(b.dataset.l); }); });
btn.addEventListener("click", function(){
  amzOpen = panel.classList.toggle("open");
  btn.setAttribute("aria-expanded", amzOpen);
  if (amzOpen) run(statsEl, false);
});

// typing headline
(function(){
  var el = document.querySelector("#role b"), i = 0, j = 0, del = false;
  if (reduce) return;
  (function tick(){
    var L = TITLES[LI], w = L[i % L.length];
    el.textContent = w.slice(0, j);
    if (!del && j < w.length) { j++; setTimeout(tick, 70); }
    else if (!del) { del = true; setTimeout(tick, 1600); }
    else if (j > 0) { j--; setTimeout(tick, 35); }
    else { del = false; i = (i + 1) % L.length; setTimeout(tick, 300); }
  })();
})();

// reveal on scroll
var io = new IntersectionObserver(function(es){
  es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
}, {threshold:.15});
document.querySelectorAll(".rv").forEach(function(el){ io.observe(el); });

// tilt on desktop
if (!reduce && matchMedia("(hover:hover)").matches) {
  document.querySelectorAll(".card").forEach(function(c){
    c.addEventListener("pointermove", function(e){
      var r = c.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      c.style.transform = "perspective(800px) rotateY(" + x * 5 + "deg) rotateX(" + -y * 5 + "deg)";
    });
    c.addEventListener("pointerleave", function(){ c.style.transform = ""; });
  });
}

var SITE_URL = "https://claude.ai/artifact/J5tcuARmmBJoMydQguqRhC"; // CHANGE to your final website link
(function(){
  try {
    var q = qrcode(0, "M"); q.addData(SITE_URL); q.make();
    var svg = q.createSvgTag({cellSize:4, margin:2, scalable:true});
    var b = document.getElementById("qrb"), m = document.getElementById("qrm");
    b.innerHTML = svg; b.hidden = false;
    document.getElementById("qrBig").innerHTML = svg;
    b.addEventListener("click", function(){ m.classList.add("on"); });
    m.addEventListener("click", function(){ m.classList.remove("on"); });
  } catch(e) {}
})();
setLang("en");
</script>
